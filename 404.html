<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>404 | Be Whale</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="icon" href="assets/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        /* ----- 404 overlay ----- */
        .error-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
            /* полупрозрачный фон с размытием, чтобы киты просвечивали */
            background: rgba(245, 245, 245, 0.05);
            user-select: none;
        }
        .error-overlay h1 {
            font-size: clamp(4.5rem, 16vw, 12rem);
            font-weight: 700;
            color: var(--black);
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.06);
        }
        .error-overlay p {
            font-size: clamp(1rem, 2.4vw, 2rem);
            color: var(--black);
            opacity: 0.75;
            margin-top: 0.25rem;
            text-align: center;
            padding: 0 4vw;
            max-width: 800px;
            line-height: 1.5;
        }
        .error-overlay a {
            color: var(--pink);
            text-underline-offset: 0.2em;
            pointer-events: auto;
            font-weight: 500;
            transition: color 0.2s;
        }
        .error-overlay a:hover {
            color: var(--light-green);
        }

        /* ----- Контейнер для китов ----- */
        #whale-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 0;
            background: var(--white);
        }

        /* ----- Каждый кит ----- */
        .whale {
            position: absolute;
            pointer-events: none;
            will-change: transform;
            border-radius: 50%;
            /* лёгкая тень для объёма */
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.04));
            transition:
                    filter 0.2s,
                    width 0.15s ease-out,
                    height 0.15s ease-out,
                    opacity 0.15s ease-out;
        }
        .whale img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* ----- Адаптив для очень маленьких экранов ----- */
        @media (max-width: 480px) {
            .error-overlay {
                background: rgba(245, 245, 245, 0.1);
            }
            .error-overlay h1 {
                font-size: clamp(3.2rem, 14vw, 5rem);
            }
            .error-overlay p {
                font-size: clamp(0.9rem, 4vw, 1.2rem);
                padding: 0 5vw;
            }
        }
    </style>
</head>
<body>

<!-- ====== КОНТЕЙНЕР КИТОВ ====== -->
<div id="whale-container"></div>

<!-- ====== ОВЕРЛЕЙ 404 ====== -->
<div class="error-overlay">
    <h1>404</h1>
    <p>
        Потерялся?<br />
        Можешь вернуться на
        <a href="Main/">начальную страницу</a>.
    </p>
</div>

<script>
    (function() {
        'use strict';

        // ---------- НАСТРОЙКИ ----------
        const WHALE_IMAGES = [
            'assets/images/pattern1.png',
            'assets/images/pattern2.png',
            'assets/images/pattern3.png',
            'assets/images/pattern4.png'
        ];

        const DENSITY_FACTOR = 60; // можно менять для общей плотности

        // Функция вычисляет целевое количество китов исходя из площади окна
        function getTargetCount() {
            const area = window.innerWidth * window.innerHeight;
            let count = area / 1_000_000 * DENSITY_FACTOR;
            count = Math.max(20, Math.min(200, Math.round(count)));
            return count;
        }

        let TARGET_COUNT = getTargetCount(); // При инициализации и при ресайзе будем пересчитывать
        const BOUNDARY_MARGIN = 100; // отступ от краёв экрана (пикселей)
        const FRICTION = 0.985; // замедление (чем меньше, тем быстрее останавливаются)
        const DRIFT_FORCE = 0.012; // сила случайного дрейфа
        const REPULSION_FORCE = 8; // сила отталкивания от курсора
        const REPULSION_RADIUS = 120; // радиус действия отталкивания
        const MAX_SPEED = 5; // максимальная скорость кита
        const MIN_WHALE_SIZE = 28;
        const MAX_WHALE_SIZE = 90;

        // ---------- СОСТОЯНИЕ ----------
        const container = document.getElementById('whale-container');
        let whales = [];
        let mouseX = -9999;
        let mouseY = -9999;
        let isInteracting = false;
        let interactionTimeout = null;

        // Размеры контейнера
        let cw = window.innerWidth;
        let ch = window.innerHeight;

        // Границы (куда можно заходить, за пределами — удаляем)
        let leftBound = -BOUNDARY_MARGIN;
        let rightBound = cw + BOUNDARY_MARGIN;
        let topBound = -BOUNDARY_MARGIN;
        let bottomBound = ch + BOUNDARY_MARGIN;

        // ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----------
        function rand(min, max) {
            return Math.random() * (max - min) + min;
        }

        function randInt(min, max) {
            return Math.floor(rand(min, max + 1));
        }

        function clamp(v, min, max) {
            return Math.max(min, Math.min(max, v));
        }

        // ---------- ЗАГРУЗКА ИЗОБРАЖЕНИЙ (кеш) ----------
        const imageCache = [];
        let imagesLoaded = 0;
        const totalImages = WHALE_IMAGES.length;

        function preloadImages(callback) {
            WHALE_IMAGES.forEach((src, index) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = function() {
                    imageCache[index] = img;
                    imagesLoaded++;
                    if (imagesLoaded === totalImages) {
                        callback();
                    }
                };
                img.onerror = function() {
                    // если картинка не загрузилась, создаём цветной квадрат-заглушку
                    const fallback = document.createElement('canvas');
                    fallback.width = 120;
                    fallback.height = 120;
                    const ctx = fallback.getContext('2d');
                    const hue = (index * 90 + 180) % 360;
                    ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;
                    ctx.beginPath();
                    ctx.arc(60, 60, 50, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 44px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🐋', 60, 60);
                    imageCache[index] = fallback;
                    imagesLoaded++;
                    if (imagesLoaded === totalImages) {
                        callback();
                    }
                };
                img.src = src;
            });
        }

        // ---------- КЛАСС КИТА ----------
        class Whale {
            constructor() {
                // случайная позиция в пределах видимой области + небольшой отступ
                this.x = rand(-BOUNDARY_MARGIN * 0.4, cw + BOUNDARY_MARGIN * 0.4);
                this.y = rand(-BOUNDARY_MARGIN * 0.4, ch + BOUNDARY_MARGIN * 0.4);
                this.size = rand(MIN_WHALE_SIZE, MAX_WHALE_SIZE);
                this.vx = rand(-0.3, 0.3);
                this.vy = rand(-0.3, 0.3);
                this.rotation = rand(0, Math.PI * 2);
                this.rotationSpeed = rand(-0.003, 0.003);
                this.imageIndex = randInt(0, WHALE_IMAGES.length - 1);
                this.opacity = rand(0.35, 0.75);
                // таймер для смены направления дрейфа
                this.driftTimer = 0;
                this.driftInterval = rand(120, 300); // кадров между сменой дрейфа
                this.driftAngle = rand(0, Math.PI * 2);

                // Создаём DOM-элемент
                this.el = document.createElement('div');
                this.el.className = 'whale';
                // Начальные размеры 0, прозрачность 0 (для анимации)
                this.el.style.width = '0px';
                this.el.style.height = '0px';
                this.el.style.opacity = '0';

                const img = document.createElement('img');
                const cached = imageCache[this.imageIndex];
                if (cached) {
                    if (cached instanceof HTMLImageElement) {
                        img.src = cached.src;
                    } else if (cached instanceof HTMLCanvasElement) {
                        img.src = cached.toDataURL();
                    } else {
                        img.src = WHALE_IMAGES[this.imageIndex];
                    }
                } else {
                    img.src = WHALE_IMAGES[this.imageIndex];
                }
                img.alt = 'кит';
                img.loading = 'lazy';
                img.draggable = false;
                this.el.appendChild(img);

                container.appendChild(this.el);

                const delay = 100 + 5 * this.size + 3 * Math.random() * this.size;
                setTimeout(() => {
                    requestAnimationFrame(() => {
                        this.el.style.width = this.size + 'px';
                        this.el.style.height = this.size + 'px';
                        this.el.style.opacity = this.opacity;
                    });
                }, delay);

                this.updateTransform();
            }


            // Обновление позиции в DOM
            updateTransform() {
                this.el.style.transform =
                    `translate(${this.x - this.size/2}px, ${this.y - this.size/2}px) rotate(${this.rotation}rad)`;
            }

            // Физика
            update() {
                // 1. Дрейф (медленное случайное блуждание)
                this.driftTimer++;
                if (this.driftTimer > this.driftInterval) {
                    this.driftTimer = 0;
                    this.driftInterval = rand(120, 300);
                    this.driftAngle = rand(0, Math.PI * 2);
                }
                const driftX = Math.cos(this.driftAngle) * DRIFT_FORCE;
                const driftY = Math.sin(this.driftAngle) * DRIFT_FORCE;
                this.vx += driftX;
                this.vy += driftY;

                // 2. Отталкивание от курсора / касания
                const dx = this.x - mouseX;
                const dy = this.y - mouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < REPULSION_RADIUS && dist > 0.01) {
                    const force = (1 - dist / REPULSION_RADIUS) * REPULSION_FORCE;
                    const angle = Math.atan2(dy, dx);
                    this.vx += Math.cos(angle) * force;
                    this.vy += Math.sin(angle) * force;
                    // лёгкий поворот при отталкивании
                    this.rotationSpeed += (Math.random() - 0.5) * 0.008;
                }

                // 3. Трение
                this.vx *= FRICTION;
                this.vy *= FRICTION;

                // 4. Ограничение скорости
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > MAX_SPEED) {
                    this.vx = (this.vx / speed) * MAX_SPEED;
                    this.vy = (this.vy / speed) * MAX_SPEED;
                }

                // 5. Обновление позиции
                this.x += this.vx;
                this.y += this.vy;

                // 6. Вращение (медленное)
                this.rotation += this.rotationSpeed;
                this.rotationSpeed *= 0.995;

                // 7. Обновление DOM
                this.updateTransform();

                // 8. Проверка границ — возвращаем true, если кит жив
                if (this.x < leftBound || this.x > rightBound ||
                    this.y < topBound || this.y > bottomBound) {
                    return false; // мёртв — удаляем
                }
                return true;
            }

            // Удаление из DOM
            destroy() {
                if (this.el && this.el.parentNode) {
                    this.el.parentNode.removeChild(this.el);
                }
            }
        }

        // ---------- УПРАВЛЕНИЕ ПОПУЛЯЦИЕЙ ----------
        function spawnWhale() {
            if (imageCache.length === totalImages && imagesLoaded === totalImages) {
                const w = new Whale();
                whales.push(w);
            } else {
                // если картинки ещё не загружены, откладываем спавн
                setTimeout(() => spawnWhale(), 100);
            }
        }

        function spawnInitial() {
            const toSpawn = Math.min(TARGET_COUNT, 40);
            for (let i = 0; i < toSpawn; i++) {
                spawnWhale();
            }
            // остальные добавятся постепенно через replenish
        }

        function replenishPopulation() {
            const current = whales.length;
            const threshold = Math.floor(TARGET_COUNT * 0.7);
            if (current < threshold) {
                const need = TARGET_COUNT - current;
                const toAdd = Math.min(need, 15); // добавляем порциями, чтобы не перегружать
                for (let i = 0; i < toAdd; i++) {
                    spawnWhale();
                }
            } else if (current < TARGET_COUNT) {
                // понемногу добиваем до цели
                const toAdd = Math.min(TARGET_COUNT - current, 2);
                for (let i = 0; i < toAdd; i++) {
                    spawnWhale();
                }
            }
        }

        // ---------- ОСНОВНОЙ ЦИКЛ ----------
        function update() {
            // Обновляем каждого кита, удаляем мёртвых
            const alive = [];
            for (const w of whales) {
                const ok = w.update();
                if (ok) {
                    alive.push(w);
                } else {
                    w.destroy();
                }
            }
            whales = alive;

            // Пополняем популяцию
            replenishPopulation();

            // Запускаем следующий кадр
            requestAnimationFrame(update);
        }

        // ---------- ОБРАБОТЧИКИ СОБЫТИЙ ----------
        function handleInteraction(x, y) {
            mouseX = x;
            mouseY = y;
            isInteracting = true;

            // Сбрасываем таймер бездействия
            if (interactionTimeout) {
                clearTimeout(interactionTimeout);
            }
            interactionTimeout = setTimeout(() => {
                isInteracting = false;
                // через 3 секунды бездействия начинаем "забывать" позицию
                // но не сбрасываем сразу, чтобы киты не дёргались
                setTimeout(() => {
                    if (!isInteracting) {
                        mouseX = -9999;
                        mouseY = -9999;
                    }
                }, 3000);
            }, 2000);
        }

        // Мышь
        document.addEventListener('mousemove', (e) => {
            handleInteraction(e.clientX, e.clientY);
        });

        // Коснуться — берём центр касания
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            if (touch) {
                handleInteraction(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        document.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            if (touch) {
                handleInteraction(touch.clientX, touch.clientY);
            }
        }, { passive: true });

        // Если мышь ушла за пределы окна — убираем фокус
        document.addEventListener('mouseleave', () => {
            mouseX = -9999;
            mouseY = -9999;
            isInteracting = false;
            if (interactionTimeout) {
                clearTimeout(interactionTimeout);
            }
        });

        // ---------- ПЕРЕСЧЁТ ПРИ ИЗМЕНЕНИИ РАЗМЕРА ОКНА ----------
        function resizeContainer() {
            cw = window.innerWidth;
            ch = window.innerHeight;
            leftBound = -BOUNDARY_MARGIN;
            rightBound = cw + BOUNDARY_MARGIN;
            topBound = -BOUNDARY_MARGIN;
            bottomBound = ch + BOUNDARY_MARGIN;

            TARGET_COUNT = getTargetCount();
        }

        window.addEventListener('resize', resizeContainer);

        function start() {
            preloadImages(() => {
                spawnInitial();
                update();
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', start);
        } else {
            start();
        }

    })();
</script>

</body>
</html>
